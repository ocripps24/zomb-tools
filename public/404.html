<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>404 - Zombie Tools</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: "Oxanium", -apple-system, BlinkMacSystemFont, "Segoe UI",
					"Arial", "Helvetica", sans-serif;
				background-color: #0e0e0e;
				color: #ffffff;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
				padding: 4rem 1.5rem;
			}

			.not-found-container {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				background-color: #1f2937;
				border-radius: 0.5rem;
				padding: 4rem;
				margin: 0;
				width: 100%;
			}

			.error-code {
				font-size: 8rem;
				font-weight: 700;
				margin-bottom: 1.5rem;
			}

			.message {
				font-size: 1.5rem;
				margin-bottom: 1.5rem;
				opacity: 0.9;
				font-weight: 600;
			}

			.description {
				font-size: 1.125rem;
				margin-bottom: 4rem;
				opacity: 0.8;
			}

			.redirect-message {
				font-size: 1rem;
				margin-bottom: 1rem;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
				opacity: 0.7;
			}

			.spinner {
				width: 16px;
				height: 16px;
				border: 2px solid rgba(255, 255, 255, 0.3);
				border-top: 2px solid white;
				border-radius: 50%;
				animation: spin 1s linear infinite;
			}

			.home-link {
				background: #ffffff;
				border: 2px solid rgba(255, 255, 255, 0.2);
				color: #0e0e0e;
				border-radius: 0.5rem;
				padding: 0.75rem 1.5rem;
				font-size: 1rem;
				font-weight: 500;
				cursor: pointer;
				transition: all 0.2s ease;
				text-decoration: none;
				display: inline-block;
			}

			.home-link:hover {
				background: #1f2937;
				border-color: #d1d5db;
				color: #ffffff;
				transform: translateY(-1px);
			}

			.home-link:active {
				transform: translateY(0);
			}

			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}

			@media (max-width: 640px) {
				.not-found-container {
					padding: 3rem 1.5rem;
				}

				.error-code {
					font-size: 6rem;
				}

				.message {
					font-size: 1.25rem;
				}

				.description {
					font-size: 1rem;
				}
			}
		</style>
	</head>
	<body>
		<div class="not-found-container">
			<div class="error-code">404</div>
			<div class="message">Page Not Found</div>
			<div class="description">The page you're looking for doesn't exist.</div>
			<div class="redirect-message">
				<div class="spinner"></div>
				Redirecting...
			</div>
			<a href="/" class="home-link">Go to Homepage</a>
		</div>

		<script>
			// GitHub Pages SPA redirect
			// Store the current path and redirect to index.html
			const path = window.location.pathname.slice(1);
			const query = window.location.search;
			const hash = window.location.hash;

			// Show redirect message for at least 1 second for better UX
			setTimeout(() => {
				// Redirect to index.html with the path as a query parameter
				window.location.replace(
					window.location.origin +
						"/?redirect=" +
						encodeURIComponent(path + query + hash)
				);
			}, 1000);
		</script>
	</body>
</html>
